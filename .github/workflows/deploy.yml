# Deploys main to your team URL (deploy contract: README.md).
#
# The image job builds the root Dockerfile with this commit's SHA baked in and pushes it to your registry
# as app:<sha>, in parallel with the quality job (the tests). Only when both pass does the deploy job point
# app:latest at app:<sha> and run .github/fagdag/rollout.sh, so :latest never holds an untested image. That redeploys your container, fails
# unless Scaleway reports it ready, then waits up to 60 s for GET /health to answer 200 with this
# commit's SHA as its version. If any of that fails, it points app:latest back at the version that
# was live before (which keeps serving) and the job fails, with the container's error_message and
# its logs since the job started in the last step.
#
# You own this file. Add your own gates (tests, Hurl examples, review checks) as jobs that the
# deploy job `needs`; they run on GitHub-hosted runners. If you break it, you lose your own ticks.
#
# The organisers set the config: the secrets SCW_ACCESS_KEY and SCW_SECRET_KEY (your push key) and
# the variables SCW_REGISTRY, SCW_CONTAINER_ID, SCW_ORGANIZATION_ID and TEAM_URL. Don't change them.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fast:
        description: Fast lane (skip the test gate), see below
        type: boolean
        default: false

# No deploy: "[no deploy]" in the commit message (for a merged PR, its title) still runs the tests (quality),
# but skips the image and the rollout, so no revision switch (requests can fail while one happens). For changes
# that don't need to be live: docs, workflow/, .claude/, specs, test-only and tooling changes. They go out with
# the next push that deploys. It wins over [fast] (the tests run); a manual run always deploys.
#
# Fast lane: "[fast]" in the commit message (for a merged PR, its title: it's in the merge commit's message),
# or the fast input on a manual run. For a fix to a check that's losing points, when every minute counts:
#   - the quality job (the test suite) is skipped, so deploy starts as soon as the image is pushed;
#   - the image job pushes app:latest itself, so deploy skips its pull/tag/push.
# Still there: the Docker build compiles the code, and rollout.sh checks /health and rolls back to the last
# good image if the new one doesn't come up. Not there: the tests. The next normal push to main tests
# everything again, the fast commit included, and doesn't deploy if a test fails.

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# Every job runs on ubuntu-24.04, not ubuntu-latest: that label moves to Ubuntu 26.04 from 2026-10-19, where e.g.
# Hurl's .deb no longer installs. Pinned, the runner only changes when we change it.

jobs:
  # The quality gate (workflow/quality-gate.md): the full test suite. Deploy needs it, so a failing
  # test never deploys.
  quality:
    # Skipped only in the fast lane; [no deploy] still runs it (and wins over [fast]).
    if: ${{ !(contains(github.event.head_commit.message, '[fast]') || inputs.fast) || contains(github.event.head_commit.message, '[no deploy]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache ~/.m2
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-
      - name: Test suite
        run: ./mvnw -B verify

  # Builds and pushes app:<sha> while the tests run. Buildx with the GitHub Actions cache reuses the
  # Dockerfile's layers between runs (above all the dependency layer, until pom.xml changes). It never
  # touches app:latest: that's the deploy job's, after the tests.
  image:
    if: ${{ !contains(github.event.head_commit.message, '[no deploy]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to the registry
        run: echo "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build and push app:<sha>
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          # Fast lane: :latest too, since there's no test gate to wait for.
          tags: ${{ vars.SCW_REGISTRY }}/app:${{ github.sha }}${{ (contains(github.event.head_commit.message, '[fast]') || inputs.fast) && format(',{0}/app:latest', vars.SCW_REGISTRY) || '' }}
          push: true
          # A plain image, as before: no attestation manifests next to it in the registry.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [quality, image]
    # Normally after both; in the fast lane quality is skipped and the image is enough.
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.quality.result == 'success' || (needs.quality.result == 'skipped' && (contains(github.event.head_commit.message, '[fast]') || inputs.fast))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # The scw CLI won't run without it, even with a key.
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
      SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      IMAGE: ${{ vars.SCW_REGISTRY }}/app
      SHA: ${{ github.sha }}
    steps:
      - name: Note the start time
        run: echo "ROLLOUT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Install the Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.65.2
      - name: Log in to the registry
        run: echo "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
      # The image job pushed app:<sha>; point app:latest at it (the same pull/tag/push rollout.sh uses
      # to roll back).
      - name: Tag as latest
        # The fast lane's image job already pushed :latest.
        if: ${{ !(contains(github.event.head_commit.message, '[fast]') || inputs.fast) }}
        run: |
          echo "Tagging $IMAGE:$SHA as $IMAGE:latest"
          docker pull "$IMAGE:$SHA"
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Roll out
        id: rollout
        env:
          ROLLOUT_URL: ${{ vars.TEAM_URL }}
          ROLLOUT_SHA: ${{ github.sha }}
          ROLLOUT_IMAGE: app
        run: .github/fagdag/rollout.sh
      # Only when the rollout failed: build errors are in the step above it. Image pull errors only
      # show up in error_message; a crash on start-up shows up in the logs.
      - name: Logs
        if: ${{ failure() && steps.rollout.outcome == 'failure' }}
        run: |
          sleep 15 # Cockpit takes a few seconds to ingest the lines.
          echo "error_message: $(scw container container get "$SCW_CONTAINER_ID" -o json | jq -r '.error_message // "(none)"')" || true
          .github/fagdag/logs.sh --tail 200 --since "$ROLLOUT_STARTED_AT"

  # A new revision hasn't compiled its hot paths yet: on the platform's small CPU, the harness's first burst after a
  # deploy took up to 5 s per request (ticks 100 and 103 timed out). This sends that kind of traffic first, but only
  # requests that change nothing (reads, and writes rejected before writing: workflow/bin/warmup.py). After the
  # deploy, as a job of its own that may fail: it never fails or holds up the deploy.
  warmup:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Warm up the new revision
        env:
          TEAM_URL: ${{ vars.TEAM_URL }}
        run: python3 workflow/bin/warmup.py "$TEAM_URL"
